name: Build kexec-mod (GKI android14-5.10, arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build-kexec-mod.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kexec-mod
        uses: actions/checkout@v4
        with:
          path: kexec-mod

      - name: Install cross toolchain + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            crossbuild-essential-arm64 clang lld llvm

      # IMPORTANT: 5.10 never got an android14-5.10 branch. GKI branches
      # are named ANDROID_RELEASE-KERNEL_VERSION and are only cut when a
      # kernel version is current for a platform release; 5.10's GKI
      # branches stopped at android13-5.10 (android14 moved to 5.15/6.1
      # for *new* devices). A device shipping Android 14 userspace on a
      # 5.10.240 kernel is running a vendor-frozen fork of that
      # android13-5.10 line at a later patch level (-240, vendor suffix
      # g9cb2f620a9a8) — so android13-5.10 is the closest public
      # approximation, not an exact match.
      - name: Checkout GKI kernel tree
        run: |
          git clone --depth=1 --branch android13-5.10 \
            https://android.googlesource.com/kernel/common gki-kernel

      # Paste the device's real /proc/config.gz output into
      # kernel-config/device.config in the repo before running this,
      # so the workflow builds with a config that actually matches
      # what shipped, rather than a generic defconfig.
      - name: Configure GKI tree
        working-directory: gki-kernel
        run: |
          cp ../kexec-mod/kernel-config/device.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld olddefconfig

      # Only need enough of the tree built to produce Module.symvers,
      # System.map, and the headers kexec-mod's Kbuild expects.
      - name: Prepare kernel build (modules_prepare)
        working-directory: gki-kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld -j"$(nproc)" modules_prepare

      - name: Build kexec-mod against GKI tree
        working-directory: kexec-mod/kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld \
            KDIR=${{ github.workspace }}/gki-kernel

      - name: Upload .ko artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kexec-mod-ko
          path: |
            kexec-mod/kernel/*.ko
            kexec-mod/kernel/**/*.ko